name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "jsonschema>=4.18" referencing
      - name: Build indexes and site
        run: |
          python tools/build_indexes.py . dist/indexes
          mkdir -p site
          cp -a schema countries.json networks.json index.json site/
          mkdir -p site/merchants
          cp merchants/registry.json site/merchants/
          mkdir -p site/indexes
          cp -a dist/indexes/. site/indexes/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
